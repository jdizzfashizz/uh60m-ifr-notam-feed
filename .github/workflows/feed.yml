name: Shared FAA production NOTAM cache
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: faa-production-feed
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: runtime
          key: nms-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: nms-snapshot-
      - name: Reserve shared FAA pull allowance
        id: reserve
        run: node sync.cjs reserve
      - name: Persist reservation before any FAA request
        if: steps.reserve.outputs.pull == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/ledger.json
          git commit -m 'Reserve shared FAA pull allowance'
          git push origin HEAD:main
      - name: Retrieve and validate production records
        id: pull
        if: steps.reserve.outputs.pull == 'true'
        continue-on-error: true
        env:
          FAA_NMS_PRODUCTION_CLIENT_ID: ${{ secrets.FAA_NMS_PRODUCTION_CLIENT_ID }}
          FAA_NMS_PRODUCTION_CLIENT_SECRET: ${{ secrets.FAA_NMS_PRODUCTION_CLIENT_SECRET }}
        run: node sync.cjs pull
      - name: Preserve synchronization outcome
        if: always() && steps.reserve.outputs.pull == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/ledger.json
          git diff --cached --quiet || git commit -m 'Record FAA synchronization outcome'
          git push origin HEAD:main
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.pull.outcome == 'success'
        with:
          path: runtime
          key: nms-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate advisory airport feeds
        if: always()
        run: node sync.cjs publish
      - name: Remove previous temporary Pages artifacts and bound runtime cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node cleanup.cjs
      - name: Package current feed only
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
          retention-days: 1
      - name: Publish shared cache
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Remove temporary deployment artifact
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node cleanup.cjs
